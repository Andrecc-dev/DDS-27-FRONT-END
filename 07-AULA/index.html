<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <header>
        <h1>TRABALHANDO COM INPUTS</h1>
    </header>

    <!-- INPUT  -->
    <main>
        <h2>fomrulário de cadastro</h2>
        <!-- TAG FORM: ENGLOBA O FORMULÁRIO -->
        <!-- ACTION: É PARA ONDE VÃO AS INFORMAÇÕES RECEBIDAS -->
        <!--  METHOD: É A FORMA COM QUE VÃO AS INFORMAÇÕES -->
        <form action="">
            <!-- LABEL: TAG PARA NOMEAR, APOIAR E GUIA O INPUT -->
            <label for="nome completo">informe seu nome</label>
            <input type="text" name="nome completo" id="nome completo">
            <button>Enviar fomrulário</button>

            <br>
            <br>
            <!-- INPUT DENTRO DO LABEL -->
             <label for="">
                senha
                <input type="password">
             </label>
        </form>
    </main>

    <footer>
        <p>&copy; direitos autorais totalmente reservado para eu</p>
    </footer>
</body>
</html>
