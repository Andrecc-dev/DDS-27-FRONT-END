<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- Tabelas -->
    <header>
        <h1>TABELAS TOP DE LINHA</h1>
    </header>

    <main>
        <h2>PRODUTOS</h2>

        <!-- CRIAÇÃO DA TABELA -->
         <!-- BORDER: CRIA UMA BORDA NA TABELA-->
        <table border="5" align="center">
            <!-- CABEÇALHO DA TABELA -->
            <thead>
                <!-- CRIAÇÃO DE UMA LINHA DA TABELA -->
                <tr>
                    <!-- TH: COLUNA DE UM CABEÇALHO-->
                    <th>ID</th>
                    <th>NOME</th>
                    <th>QUANTIDADE</th>
                    <th>PREÇO</th>
                    <th>CATEGORIA</th>
                </tr>
            </thead>

            <!-- CRIAÇÃO DO CORPO DA TABELA -->
             <tbody>
                <tr>
                    <!-- TD = CÉLULA DA LINHA DO CORPO -->
                    <td>1</td>
                    <TD>SHAMPOO CR7</TD>
                    <TD align="center"> 7 </TD>
                    <TD align="center">RS$ 77,00</TD>
                    <TD> HIGIENE PESSOAL</TD>
                </tr>
                 <tr>
                    <!-- TD = CÉLULA DA LINHA DO CORPO -->
                    <td>2</td>
                    <TD>PASSA-TEMPO</TD>
                    <TD align="center">80</TD>
                    <TD align="center">RS$ 04,99</TD>
                    <TD>ALIMENTOS</TD>
                </tr>
                 <tr>
                    <!-- TD = CÉLULA DA LINHA DO CORPO -->
                    <td>3</td>
                    <TD colspan="3">CAFÉ CAFUSO</TD>
                    <TD rowspan="2">ALIMENTOS GOURMET</TD>
                </tr>
                 <tr>
                    <!-- TD = CÉLULA DA LINHA DO CORPO -->
                    <td>4</td>
                    <TD>PENTE DE OVOS </TD>
                    <TD align="center">150</TD>
                    <TD align="center"> RS$ 18,99</TD>
                </tr>
             </tbody>

             <tfoot>
                <tr>
                    <td colspan="5"> TABELA FEITA POR: CR7 JR</td>
                </tr>
             </tfoot>
        </table>
    </main>

    <footer>
        <p>pode seguir nois por favor e comprar um cafézin</p>
    </footer>
</body>
</html>
